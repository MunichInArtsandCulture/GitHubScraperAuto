name: Run All Job Scrapers

on:
  schedule:
    - cron: "0 8 * * 1"  # Jeden Montag um 08:00 Uhr
  workflow_dispatch:      # Manuell auslösbar

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout Code
        uses: actions/checkout@v6

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 trafilatura python-dotenv openai aiogram

      - name: 🚀 Run Universal Job Scraper
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python universal_scraper.py

      - name: 💾 Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add categorized_jobs.txt jobs.json scraped_history.json || true
          git commit -m "📄 Update job list (automated)" || echo "No changes to commit"
          git push origin HEAD:main
