name: Run All Job Scrapers

on:
  schedule:
    - cron: "0 8 * * 1"  # Jeden Montag um 08:00 Uhr
  workflow_dispatch:      # Manuell auslösbar

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout Code
        uses: actions/checkout@v3

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium beautifulsoup4 openai aiogram webdriver-manager

      - name: 🌐 Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser
          echo "CHROME_BIN=$(which chromium-browser)" >> $GITHUB_ENV

      - name: 🚀 Run Master Script
        run: |
          set -e
          python 0000ScraperTotal.py

      - name: 💾 Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cooljobs.txt categorized_jobs.txt || true
          git commit -m "📄 Update job list (automated)" || echo "No changes to commit"
          git push
